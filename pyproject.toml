[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iut-qbank"
version = "0.1.0"
description = "IUT Question Bank MCP Server — retrieval prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Configuration
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # Vector store
    "qdrant-client>=1.9",
    # PDF processing
    "pymupdf>=1.24",
    # OCR
    "pytesseract>=0.3",
    "Pillow>=10.0",
    # Embeddings
    "sentence-transformers>=3.0",
    # MCP
    "fastmcp>=2.0",
    # HTTP server (for HTTP transport / Render deployment)
    "uvicorn>=0.30",
    "starlette>=0.40",
    # HTTP client
    "httpx>=0.27",
    # Utilities
    "structlog>=24.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "testcontainers[postgres,qdrant]>=4.7",
    "factory-boy>=3.3",
    "faker>=25.0",
    "types-Pillow",
]

[project.scripts]
qbank-mcp    = "apps.mcp_server.main:main"
qbank-api    = "apps.api.main:main"
qbank-worker = "apps.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qbank", "apps"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
python_files  = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (requires running services)",
    "e2e: End-to-end tests",
    "slow: Tests that take > 5 seconds",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "apps", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "RUF",      # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qbank"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version    = "3.12"
strict            = true
warn_return_any   = true
warn_unused_configs = true
exclude           = ["tests/"]
mypy_path         = "src"

[[tool.mypy.overrides]]
module = [
    "pymupdf.*",
    "pytesseract.*",
    "sentence_transformers.*",
    "qdrant_client.*",
]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit   = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
