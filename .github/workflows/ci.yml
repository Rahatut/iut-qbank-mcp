name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -m unit --cov=src --cov-report=xml -v
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qbank_test
          POSTGRES_USER: qbank
          POSTGRES_PASSWORD: qbank
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run database migrations
        run: alembic upgrade head
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_DB: qbank_test
          POSTGRES_USER: qbank
          POSTGRES_PASSWORD: qbank
      - run: pytest tests/integration -m integration -v
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_DB: qbank_test
          POSTGRES_USER: qbank
          POSTGRES_PASSWORD: qbank
          QDRANT_HOST: localhost
          QDRANT_ACTIVE_COLLECTION: iut_qbank_chunks_v1
