# Development overrides — applied automatically when running `docker compose up`
# Exposes all ports locally for development debugging.
# Note: Qdrant runs in Qdrant Cloud (haruta). To run Qdrant locally instead:
#   docker compose --profile local-qdrant up
name: iut-qbank

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
