# Development overrides — applied automatically when running `docker compose up`
# Exposes all ports locally for development debugging.
name: iut-qbank

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
